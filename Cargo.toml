[package]
name = "dsh-wsl-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell for the DeepSeek Harness WebUI with core-version-aware builds"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
